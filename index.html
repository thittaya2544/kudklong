<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>บริการประชาชน รพ.สต.คลองจระเข้</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff0000;
  --red-hover:#cc0000;
  --blue:#065fd4;
  --neutral:#606060;
  --background:#ffffff;
  --surface:#f2f2f2;
  --text:#0f0f0f;
  --text-secondary:#606060;
  --border:#e5e5e5;
  --success:#2ba640;
  --warning:#fb8c00;
  --error:#ff0000;
  --radius-card:12px;
  --radius-control:9999px;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--background)}
body{
  margin:0;
  min-height:100vh;
  background:var(--background);
  color:var(--text);
  font-family:Roboto,"Noto Sans Thai",Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
header{
  position:relative;
  background:var(--background);
  color:var(--text);
  padding:18px 16px 16px;
  border-bottom:1px solid var(--border);
}
header:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:3px;
  background:var(--red);
}
.head{max-width:620px;margin:0 auto}
.brand-mark{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:7px;
  color:var(--text-secondary);
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
}
.brand-dot{width:8px;height:8px;background:var(--red);border-radius:50%}
header h1{margin:0;font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.2px}
header p{margin:4px 0 0;color:var(--text-secondary);font-size:13px;line-height:19px}
main{width:100%;max-width:620px;margin:20px auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.card{
  background:var(--background);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  padding:18px;
  margin:14px 0;
}
#status{display:flex;align-items:center;gap:8px;min-height:24px;color:var(--text-secondary)}
#status:before{content:"";width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#bdbdbd}
#status.connected:before{background:var(--success)}
#status.status-error:before{background:var(--error)}
label{display:block;margin-top:14px;color:var(--text);font-size:13px;font-weight:700}
input[type=text]{
  display:block;
  width:100%;
  min-height:44px;
  padding:11px 14px;
  margin:6px 0 12px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  background:var(--surface);
  color:var(--text);
  font:500 15px/20px Roboto,"Noto Sans Thai",sans-serif;
  text-transform:uppercase;
  letter-spacing:2px;
  transition:border-color .15s,background .15s;
}
input[type=text]:focus{border-color:var(--text);background:#fff;box-shadow:0 0 0 1px var(--text)}
input::placeholder{color:#888;letter-spacing:0;font-weight:400}
button{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:5px 6px 5px 0;
  padding:9px 16px;
  border:1px solid transparent;
  border-radius:var(--radius-control);
  background:var(--text);
  color:#fff;
  font-size:14px;
  line-height:20px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s,border-color .15s,transform .15s;
  -webkit-tap-highlight-color:transparent;
}
button:hover{background:#272727}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
button.secondary:hover{background:#e8e8e8}
button.danger{background:#fff;color:var(--red);border-color:#ffc7c7}
button.danger:hover{background:#fff1f1;border-color:var(--red)}
button:disabled{opacity:.55;cursor:wait;transform:none}
.notice{
  background:var(--surface);
  border-left:3px solid var(--red);
  border-radius:4px 8px 8px 4px;
  padding:11px 13px;
  color:#424242;
  font-size:13px;
  line-height:1.65;
}
.muted{color:var(--text-secondary);font-size:13px;line-height:1.65}
.msg{min-height:20px;margin-top:10px;font-size:13px;line-height:1.6}
.ok{color:var(--success)}
.err{color:var(--error)}
.pill{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--border);
  border-radius:var(--radius-control);
  background:var(--surface);
  color:var(--text);
  padding:4px 10px;
  font-size:12px;
  line-height:18px;
  font-weight:700;
  white-space:nowrap;
}
.hidden{display:none!important}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
  line-height:1.6;
}
.row:last-child{border-bottom:0}
.row span:first-child{flex:0 0 38%;color:var(--text-secondary)}
.row span:last-child{min-width:0;text-align:right;overflow-wrap:anywhere;color:var(--text)}
.consent{display:flex;align-items:flex-start;gap:9px;margin:12px 0 14px;color:var(--text);font-size:13px;font-weight:400;line-height:1.6}
.consent input{width:18px;height:18px;flex:0 0 18px;margin:2px 0 0;accent-color:var(--blue)}
.result-card h3{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:0 0 12px;font-size:17px;line-height:25px;font-weight:700}
.result-card .advice{margin:14px 0 8px;padding:12px;background:var(--surface);border-radius:8px;color:var(--text);font-size:13px;line-height:1.7}
.result-card .disclaimer{margin:10px 0 0;color:var(--text-secondary);font-size:12px;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px}
@media(max-width:420px){
  header{padding:16px 14px}
  header h1{font-size:19px}
  main{margin-top:14px;padding-left:12px;padding-right:12px}
  .card{padding:15px}
  .row{gap:9px}
  .row span:first-child{flex-basis:40%}
  .actions button{flex:1 1 100%;margin-right:0}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="head">
  <div class="brand-mark"><span class="brand-dot"></span> KHLONG CHORAKHE HEALTH STATION</div>
  <h1>บริการสำหรับประชาชน</h1>
  <p>โรงพยาบาลส่งเสริมสุขภาพตำบลคลองจระเข้</p>
</div></header>

<main>
  <div class="card">
    <div id="status" class="muted">กำลังเชื่อมต่อ LINE…</div>

    <div id="linkBox" class="hidden">
      <div class="notice">รับรหัสผูกบัญชีจากเจ้าหน้าที่ รหัสใช้ได้ครั้งเดียวและหมดอายุใน 15 นาที</div>
      <label for="code">รหัสจากเจ้าหน้าที่</label>
      <input id="code" type="text" maxlength="10" autocomplete="one-time-code" placeholder="รหัส 10 ตัวอักษร">
      <label class="consent">
        <input id="consent" type="checkbox">
        <span>ยินยอมให้เชื่อมบัญชี LINE เพื่อดูผลคัดกรองและรับคำแนะนำทาง LINE</span>
      </label>
      <button id="linkBtn" onclick="linkAccount()">ยืนยันและผูกบัญชี</button>
    </div>

    <div id="actions" class="hidden actions">
      <button class="secondary" onclick="loadLatest()">ดูผลคัดกรองล่าสุด</button>
      <button class="danger" onclick="unlinkAccount()">ยกเลิกการผูกบัญชี</button>
    </div>

    <div id="message" class="msg"></div>
  </div>

  <div id="result"></div>
</main>

<script>
const LIFF_ID = "2012366817-VQMvcXPl";
const API_URL = "https://script.google.com/macros/s/AKfycbzmSLlNi3KrifNpgYFpmnt8vdtbc_VEniPl35am8qZayfF0kAdUTGK-e0pDoBpzifWd/exec";

let idToken = "";

function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function show(text, ok){
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

async function api(action, payload){
  const res = await fetch(API_URL, {
    method: "POST",
    redirect: "follow",
    // ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight ซึ่ง Apps Script ไม่รองรับ
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({action: action, idToken: idToken}, payload || {}))
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");
  return json.data;
}

async function start(){
  const status = document.getElementById("status");
  try {
    await liff.init({liffId: LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error("ไม่ได้รับ ID token กรุณาเปิดผ่าน LINE OA ใหม่");
    status.textContent = "เชื่อมต่อ LINE แล้ว";
    status.className = "muted connected";
    document.getElementById("linkBox").classList.remove("hidden");
    document.getElementById("actions").classList.remove("hidden");
  } catch (e) {
    status.textContent = e.message || "เชื่อมต่อ LINE ไม่สำเร็จ";
    status.className = "msg err status-error";
  }
}

async function linkAccount(){
  const btn = document.getElementById("linkBtn");
  btn.disabled = true;
  try {
    if (!document.getElementById("consent").checked) throw new Error("กรุณายืนยันความยินยอมก่อน");
    const code = document.getElementById("code").value.trim().toUpperCase();
    const r = await api("link", {code: code, consent: true});
    show(r.message, true);
    document.getElementById("code").value = "";
  } catch (e) { show(e.message, false); }
  btn.disabled = false;
}

async function loadLatest(){
  try {
    const r = await api("latest");
    document.getElementById("result").innerHTML =
      "<div class='card result-card'><h3>" + esc(r.name) +
      " <span class='pill'>" + esc(r.color) + "</span></h3>" +
      "<div class='row'><span>หมู่บ้าน</span><span>" + esc(r.village) + "</span></div>" +
      "<div class='row'><span>วันที่คัดกรอง</span><span>" + esc(r.date) + "</span></div>" +
      "<div class='row'><span>ความดันโลหิต</span><span>" + esc(r.sbp) + "/" + esc(r.dbp) + " mmHg — " + esc(r.bp) + "</span></div>" +
      "<div class='row'><span>น้ำตาล</span><span>" + esc(r.glucose) + " mg/dL — " + esc(r.dm) + "</span></div>" +
      "<div class='row'><span>ปิงปองจราจร 7 สี</span><span>" + esc(r.color) + "</span></div>" +
      "<div class='advice'><b>คำแนะนำ:</b> " + esc(r.advice || "โปรดติดต่อเจ้าหน้าที่เพื่อรับคำแนะนำ") + "</div>" +
      "<p class='disclaimer'>ผลคัดกรองเบื้องต้น ไม่ใช่การวินิจฉัยโรค หากมีอาการผิดปกติ โปรดติดต่อเจ้าหน้าที่สาธารณสุข</p></div>";
    show("", true);
  } catch (e) { show(e.message, false); }
}

async function unlinkAccount(){
  if (!confirm("ยืนยันยกเลิกการผูกบัญชี LINE หรือไม่")) return;
  try {
    const r = await api("unlink");
    document.getElementById("result").innerHTML = "";
    show(r.message, true);
  } catch (e) { show(e.message, false); }
}

start();
</script>
</body>
</html>
